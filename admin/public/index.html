<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<script src="/theme.js"></script>
<meta name="admin-token" content="__TOKEN__">
<title>피그온봇 관리</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="rail" id="tabs" aria-label="주 메뉴">
  <a class="rail-logo" href="#/" aria-label="피그온봇 홈">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-3.6 0-6.5 2.7-6.5 6.2 0 2.2 1.1 3.6 2.4 4.6V17a1 1 0 0 0 1 1h6.2a1 1 0 0 0 1-1v-3.2c1.3-1 2.4-2.4 2.4-4.6C18.5 5.7 15.6 3 12 3Z"/><path d="M9.5 21h5"/><circle cx="9.6" cy="9.4" r="1.1" class="fill"/><circle cx="14.4" cy="9.4" r="1.1" class="fill"/></svg>
  </a>
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
    <span>홈</span>
  </a>
  <a href="#/runs" data-tab="runs">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3M7.5 14h4M7.5 17h7"/></svg>
    <span>내역</span>
  </a>
  <a href="#/harness" data-tab="harness">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    <span>하네스</span>
  </a>
  <a href="#/flow" data-tab="flow">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="6" height="5" rx="1.5"/><rect x="14.5" y="9.5" width="6" height="5" rx="1.5"/><rect x="3.5" y="15.5" width="6" height="5" rx="1.5"/><path d="M9.5 6h3a2 2 0 0 1 2 2v1.5M9.5 18h3a2 2 0 0 0 2-2v-1.5"/></svg>
    <span>동작 원리</span>
  </a>
  <a href="#/settings" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
    <span>설정</span>
  </a>
</nav>
<div class="shell">
  <header class="top">
    <div class="brand">
      <b>피그온봇</b>
    </div>
    <form class="top-search" id="top-search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input type="search" id="top-q" placeholder="티켓번호나 제목으로 실행 내역 찾기" aria-label="티켓번호나 제목으로 실행 내역 찾기">
    </form>
    <div class="top-actions">
      <button class="icon-btn" id="theme-toggle" type="button">
        <svg class="when-dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        <svg class="when-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        <span class="when-dark sr-only">밝은 화면으로 바꾸기</span>
        <span class="when-light sr-only">어두운 화면으로 바꾸기</span>
      </button>
      <div class="status-chip" id="status-chip" aria-live="polite"><span class="dot"></span><span>확인 중</span></div>
      <button class="icon-btn" id="chat-toggle" type="button" aria-controls="chat" aria-expanded="false" aria-label="Claude 대화창">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4.5 20l1.3-4A7.5 7.5 0 1 1 20 12Z"/><path d="M9 11h.01M12.5 11h.01M16 11h.01"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <footer class="site-foot">
    <span>© 2026 피그온봇</span>
    <span>Made by <b>신승민</b> · 선진기술연구소 디지털혁신센터 솔루션팀</span>
  </footer>
</div>
<aside class="chat" id="chat" aria-labelledby="chat-title" hidden>
  <header class="chat-head">
    <span class="chat-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3.5v4M12 16.5v4M3.5 12h4M16.5 12h4M6 6l2.8 2.8M15.2 15.2 18 18M6 18l2.8-2.8M15.2 8.8 18 6"/></svg>
    </span>
    <div class="chat-title">
      <h2 id="chat-title">Claude</h2>
      <span>피그온봇 폴더 · 편집 가능</span>
    </div>
    <button class="icon-btn small" id="chat-new" type="button" aria-label="새 대화">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn small" id="chat-close" type="button" aria-label="대화창 닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div class="chat-warn" id="chat-warn" hidden></div>
  <div class="chat-log" id="chat-log"></div>
  <form class="chat-form" id="chat-form">
    <textarea id="chat-input" rows="1" maxlength="4000" placeholder="봇에 대해 물어보세요" aria-label="Claude에게 보낼 메시지"></textarea>
    <button class="chat-send" id="chat-send" type="submit" aria-label="보내기">
      <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
    </button>
  </form>
  <p class="chat-foot">Enter 보내기 · Shift+Enter 줄바꿈 · 파일을 읽고 답만 해요</p>
</aside>
<dialog class="sheet" id="sheet" closedby="any" aria-labelledby="sheet-title" aria-describedby="sheet-desc">
  <h2 id="sheet-title"></h2>
  <p id="sheet-desc"></p>
  <form class="sheet-btns" method="dialog">
    <button class="btn sub" value="" autofocus>닫기</button>
    <button class="btn main" id="sheet-ok" value="ok"></button>
  </form>
</dialog>
<!-- 스크린샷 크게 보기: 같은 화면 위에 띄운다. Esc · 바깥 누르기로 닫고, ←/→ 로 다른 장면으로 넘어간다 -->
<dialog class="viewer" id="viewer" closedby="any" aria-label="스크린샷 크게 보기">
  <div class="viewer-bar">
    <span class="viewer-cap" id="viewer-cap"></span>
    <span class="viewer-pos" id="viewer-pos"></span>
    <form method="dialog"><button class="viewer-close" aria-label="닫기" autofocus>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button></form>
  </div>
  <img class="viewer-img" id="viewer-img" alt="">
  <button class="viewer-nav prev" id="viewer-prev" type="button" aria-label="이전 스크린샷"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="viewer-nav next" id="viewer-next" type="button" aria-label="다음 스크린샷"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</dialog>
<div class="toast" id="toast" popover="manual"></div>
<div class="sr-only" id="announce" aria-live="polite"></div>
<script src="/app.js"></script>
<script src="/chat-panel.js"></script>
</body>
</html>
